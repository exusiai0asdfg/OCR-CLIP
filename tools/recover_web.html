    const saved = JSON.parse(value || "{}");
    for (const [path, state] of Object.entries(saved || {})) {
      if (refs.has(path) && statuses.has(state) && state !== "pending") clean[path] = state;
    }
  } catch {
    const notice = byId("storageNotice");
    notice.hidden = false;
    notice.textContent = "已保存的进度无法读取。本页从待检查状态开始。";
  }
  return clean;
}

try {
  progress = readProgress(localStorage.getItem(storageKey));
} catch {
  storageWarning();
}

function setProgress(path, state) {
  if (state === "pending") delete progress[path];
  else progress[path] = state;
  try {
    localStorage.setItem(storageKey, JSON.stringify(progress));
  } catch {
    storageWarning();
  }
  updateStats();
  if (byId("statusFilter").value !== "all") render();
}

function updateStats() {
  const counts = {success: 0, invalid: 0, skipped: 0};
  for (const state of Object.values(progress)) counts[state]++;
  for (const name of Object.keys(counts)) byId(name).textContent = counts[name];
  byId("remaining").textContent = records.length - counts.success - counts.invalid;
}

function createElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function appendOption(select, value, text) {
  const option = createElement("option", null, text);
  option.value = value;
  select.append(option);
}

function validUrl(value) {
  try {
    const url = new URL(value);
    if (!["http:", "https:"].includes(url.protocol) || url.username || url.password) return null;
    url.hash = "";
    return url.href;
  } catch {
    return null;
  }
}

function openInTab(url) {
  if (url) window.open(url, "_blank", "noopener,noreferrer");
}

function waybackUrl(original) {
  return original && "https://web.archive.org/web/*/" + original;
}

async function copyFilename(name) {
  const field = byId("copyField");
  const fallback = byId("manualCopy");
  let copied = false;
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(name);
      copied = true;
    }
  } catch {}
  if (!copied) {
    const priorFocus = document.activeElement;
    fallback.hidden = false;
    field.value = name;
    field.focus();
    field.select();
    try { copied = document.execCommand("copy"); } catch {}
    if (copied) priorFocus?.focus();
  }
  fallback.hidden = copied;
  byId("message").textContent = copied ? "已复制 " + name : "请按 Ctrl+C 复制已选中的文件名。";
}

function createCard(record) {
  const card = createElement("article", "row");
  card.dataset.state = progress[record.path] || "pending";
  const filename = record.path.split("/").pop();
  const content = createElement("div");
  content.append(
    createElement("h3", null, filename),
    createElement("p", "url", record.url),
    createElement("p", "reason", record.reasons.join("；"))
  );
  const status = createElement("label", "state-label", "当前状态");
  const select = createElement("select");
  select.setAttribute("aria-label", filename + " 的处理状态");
  for (const [value, label] of Object.entries(statusLabels)) appendOption(select, value, label);
  select.value = card.dataset.state;
  select.addEventListener("change", () => {
    card.dataset.state = select.value;
    setProgress(record.path, select.value);
    byId("message").textContent = filename + " · " + statusLabels[select.value];
  });
  status.append(select);
  const actions = createElement("div", "actions");
  const url = validUrl(record.url);
  for (const [label, action, disabled] of [
    ["打开原始 URL", () => openInTab(url), !url],
    ["打开 Wayback Machine", () => openInTab(waybackUrl(url)), !url],
    ["复制文件名", () => copyFilename(filename), false]
  ]) {
    const button = createElement("button", label === "打开原始 URL" ? "open" : null, label);
    button.type = "button";
    button.disabled = disabled;
    button.addEventListener("click", action);
    actions.append(button);
  }
  card.append(content, status, actions);
  return card;
}

function render() {
  const query = byId("search").value.trim().toLowerCase();
  const status = byId("statusFilter").value;
  const reason = byId("reasonFilter").value;
  const fragment = document.createDocumentFragment();
  let count = 0;
  for (const group of groups) {
    if (reason !== "all" && group !== reason) continue;
    const matches = records.filter(record =>
      record.group === group &&
      (status === "all" || (progress[record.path] || "pending") === status) &&
      (!query || [record.path, record.url, ...record.reasons].join(" ").toLowerCase().includes(query))
    );
    if (!matches.length) continue;
    const section = createElement("section");
    section.append(createElement("h2", null, group + "(" + matches.length + ")"));
    for (const record of matches) section.append(createCard(record));
    count += matches.length;
    fragment.append(section);
  }
  if (!count) fragment.append(createElement("p", "muted", "没有符合当前筛选条件的文件。"));
  byId("records").replaceChildren(fragment);
  byId("visibleCount").textContent = "显示 " + count + " / " + records.length + " 张";
}

for (const [value, label] of Object.entries(statusLabels)) appendOption(byId("statusFilter"), value, label);
for (const group of groups) appendOption(byId("reasonFilter"), group, group);
byId("search").addEventListener("input", render);
byId("statusFilter").addEventListener("change", render);
byId("reasonFilter").addEventListener("change", render);
window.addEventListener("storage", event => {
  if (event.key !== storageKey && event.key !== null) return;
  progress = readProgress(event.newValue);
  updateStats();
  render();
});
updateStats();
render();
</script>
</body>
</html>
